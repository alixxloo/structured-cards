# Release automation. A push of a version tag or a manual dispatch builds the
# plugin in a clean environment, runs the whole test suite, and attaches
# main.js / manifest.json / styles.css to a GitHub Release whose tag is exactly
# the version string -- the three files every installer path (Obsidian's
# community flow, BRAT and install.sh / install.ps1) download. NO additional
# files (screenshots, zips, anything else) are ever attached: Obsidian's
# community plugin flow expects only those three.
#
# Tag triggers: GitHub Actions tag filters are globs, not regex -- the special
# characters are `?`, `*` and `[...]` ranges, and `+` has no quantifier meaning.
# A regex-style '[0-9]+.[0-9]+.[0-9]+' would look for literal "+" characters in
# the tag and would never match "0.2.0". So the trigger below is as wide as
# three dot-separated segments can be, and the Publish step guards the actual
# release with a real validation: anything that is not a bare semver tag
# (exact X.Y.Z, no v prefix, no suffix) fails loudly instead of publishing.
#
# workflow_dispatch accepts an optional `version` input (X.Y.Z); with no input
# it fails the guard -- a manual run without a version publishes nothing.

name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z, no v prefix)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 engines are ^22.22.2 || ^24.15.0 || >=26; undici 8 needs
          # >= 22.19 (see ci.yml for the archaeology).
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${DISPATCH_VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Obsidian community plugins version by bare X.Y.Z tags. Accept
          # nothing else -- no "v" prefix, no suffix.
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a bare semver tag (expected X.Y.Z, no v prefix)"
            exit 1
          fi
          VERSION="$TAG"
          node tools/release-notes.mjs "$VERSION" > .release-notes.md

          # Exactly the three Obsidian release assets -- never more.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file .release-notes.md \
              main.js manifest.json styles.css
          fi
