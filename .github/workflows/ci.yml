# Builds and tests on every push and pull request. This proves that a clean
# checkout can rebuild the artifact from source and that the full suite passes
# in isolation - the release workflow (.github/workflows/release.yml) does the
# same build in a clean environment at tag time and attaches the actual
# main.js / manifest.json / styles.css assets. main.js itself is NOT committed:
# it is a build product, gitignored since after the 0.1.0 release.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 engines are ^22.22.2 || ^24.15.0 || >=26; undici 8 needs
          # >= 22.19, so Node 20 was an install that passed and a require that
          # blew up in every jsdom suite.
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare stubs
        run: npm run prepare-stubs

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Syntax-check the source
        run: node --check src/main.js

      # `npm test` already runs this. Listed separately so a coherence failure
      # is obvious from the CI summary rather than buried in the suite output.
      - name: Check the release metadata is coherent
        run: node tests/manifest.cjs
